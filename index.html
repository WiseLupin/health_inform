<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 진료수첩">
<title>우리집 진료수첩</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a27; --sub:#6b746f; --line:#e3ddd0;
  --main:#2f6f5e; --main-soft:#dcebe5; --warn:#c2552d; --warn-soft:#f7e1d7;
  --ok:#3f7d3a; --ok-soft:#e1efdc; --info:#3c5d8f; --info-soft:#e0e8f4;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header .hsub{font-size:13px;color:var(--sub)}
main{padding:8px 16px calc(96px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--main);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--sub);font-size:13px}
.small{font-size:13px}
h2{font-size:17px;margin:18px 0 6px}
h3{font-size:15px;margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--main);color:#fff;border-color:var(--main)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.t-un{background:var(--warn-soft);color:var(--warn)}
.t-req{background:var(--info-soft);color:var(--info)}
.t-paid{background:var(--ok-soft);color:var(--ok)}
.t-no{background:#ece9e2;color:var(--sub)}
.who{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;color:#fff}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--main);color:#fff}
.btn.sub{background:var(--main-soft);color:var(--main)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;width:56px;height:56px;border-radius:50%;
  border:0;background:var(--main);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.rec h3{font-size:16px}
.rec .meds{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.rec .meds li{padding:2px 0}
.rec .meds .ing{color:var(--sub);font-size:12px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--sub)}
pre.prompt{white-space:pre-wrap;word-break:break-all;background:#f0ece2;border-radius:10px;padding:10px;font-size:12.5px;max-height:220px;overflow:auto;margin:6px 0}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,25,23,.45);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.medbox{border:1px dashed var(--line);border-radius:10px;padding:8px 10px 10px;margin:8px 0;background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  background:#1f2a27;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.notice{background:var(--warn-soft);color:#7a3418;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.okbox{background:var(--ok-soft);color:#2c5a28;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size:14px}
.seg button.on{background:var(--main);color:#fff;border-color:var(--main)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.steps{margin:6px 0;padding-left:20px;font-size:14px}
.steps li{margin:3px 0}
</style>
</head>
<body>
<header>
  <h1>우리집 진료수첩</h1>
  <div class="hsub" id="hsub"></div>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="새 기록">＋</button>
<nav id="nav">
  <button data-tab="records"><span class="ic">📋</span>진료기록</button>
  <button data-tab="meds"><span class="ic">💊</span>약</button>
  <button data-tab="insurance"><span class="ic">🧾</span>보험청구</button>
  <button data-tab="import"><span class="ic">📷</span>캡쳐등록</button>
  <button data-tab="settings"><span class="ic">⚙️</span>가족·백업</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
/* ================= 데이터 ================= */
const KEY = 'medinfo-v1';
const COLORS = ['#2f6f5e','#c2552d','#3c5d8f','#8a5a9e','#b08900','#4f7f8f','#a2456b'];
const INS = {
  unclaimed:{label:'미청구',cls:'t-un'},
  claimed:{label:'청구함',cls:'t-req'},
  paid:{label:'지급완료',cls:'t-paid'},
  none:{label:'청구안함',cls:'t-no'}
};
let db = load();
let ui = { tab:'records', member:'all', q:'', insFilter:'unclaimed' };

function blank(){ return {app:'medinfo',version:1,members:[],records:[],deleted:[],lastBackup:null}; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const d = JSON.parse(raw);
    return Object.assign(blank(), d);
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('저장에 실패했어요. 저장 공간이 부족할 수 있어요. 백업 파일을 먼저 내려받아 두세요.'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const now = () => new Date().toISOString();
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n===null||n===undefined||n==='') ? '' : Number(n).toLocaleString('ko-KR')+'원';
const toNum = v => { if(v===null||v===undefined||v==='') return null; const n = Number(String(v).replace(/[^\d.-]/g,'')); return isNaN(n)?null:n; };
const member = id => db.members.find(m=>m.id===id);
function whoTag(id){
  const m = member(id);
  if(!m) return '<span class="who" style="background:#999">미지정</span>';
  return `<span class="who" style="background:${m.color}">${esc(m.name)}</span>`;
}
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function normDate(s){
  if(!s) return '';
  const m = String(s).match(/(\d{4})\D{0,3}(\d{1,2})\D{0,3}(\d{1,2})/);
  if(!m) return '';
  return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
}
// 브라우저가 저장소를 임의로 지우지 않도록 요청
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ================= 화면 전환 ================= */
document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  ui.tab = b.dataset.tab; render(); window.scrollTo(0,0);
});
document.getElementById('fab').onclick = ()=> openEditor();

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===ui.tab));
  document.getElementById('fab').style.display = (ui.tab==='records') ? '' : 'none';
  const unclaimed = db.records.filter(r=>(r.insurance?.status||'unclaimed')==='unclaimed').length;
  document.getElementById('hsub').textContent =
    `가족 ${db.members.length}명 · 기록 ${db.records.length}건` + (unclaimed?` · 미청구 ${unclaimed}건`:'');
  const v = document.getElementById('view');
  if(!db.members.length && ui.tab!=='settings' && ui.tab!=='import'){ v.innerHTML = welcome(); bindWelcome(); return; }
  ({records:viewRecords, meds:viewMeds, insurance:viewInsurance, import:viewImport, settings:viewSettings})[ui.tab](v);
}

function welcome(){
  return `<div class="card">
    <h3>처음 오셨네요 👋</h3>
    <p class="small">기록할 가족을 먼저 등록해 주세요.</p>
    <ol class="steps">
      <li><b>가족 대표 한 명</b>이 가족 전원을 등록해요.</li>
      <li>그다음 <b>백업 파일</b>을 아내·자녀에게 보내요.</li>
      <li>가족은 앱을 열고 그 파일을 <b>가져오기</b>만 하면 같은 가족 목록으로 시작해요.</li>
    </ol>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="wAdd">가족 등록하기</button>
      <button class="btn sub" id="wImp">받은 백업 가져오기</button>
    </div></div>`;
}
function bindWelcome(){
  document.getElementById('wAdd').onclick = ()=>openMember();
  document.getElementById('wImp').onclick = ()=>pickBackup();
}

function memberChips(){
  return `<div class="chips" id="chips">
    <button class="chip ${ui.member==='all'?'on':''}" data-m="all">전체</button>
    ${db.members.map(m=>`<button class="chip ${ui.member===m.id?'on':''}" data-m="${m.id}">${esc(m.name)}</button>`).join('')}
  </div>`;
}
function bindChips(){
  document.getElementById('chips').onclick = e=>{
    const b = e.target.closest('[data-m]'); if(!b) return; ui.member = b.dataset.m; render();
  };
}
function filtered(){
  const q = ui.q.trim().toLowerCase();
  return db.records
    .filter(r=> ui.member==='all' || r.memberId===ui.member)
    .filter(r=>{
      if(!q) return true;
      const hay = [r.hospital,r.department,r.diagnosis,r.symptoms,r.memo,
        ...(r.medications||[]).flatMap(m=>[m.name,m.ingredient])].join(' ').toLowerCase();
      return hay.includes(q);
    })
    .sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.updatedAt||'').localeCompare(a.updatedAt||''));
}

/* ================= 진료기록 ================= */
function recCard(r){
  const st = INS[r.insurance?.status||'unclaimed'];
  const meds = (r.medications||[]).filter(m=>m.name);
  return `<div class="card rec" data-id="${r.id}">
    <div class="row between">
      <div class="row">${whoTag(r.memberId)}<span class="muted">${esc(r.date)}</span></div>
      <span class="tag ${st.cls}">${st.label}</span>
    </div>
    <h3 style="margin-top:6px">${esc(r.hospital||'(병원명 없음)')}${r.department?` <span class="muted">· ${esc(r.department)}</span>`:''}</h3>
    ${r.diagnosis?`<div class="small">🩺 ${esc(r.diagnosis)}</div>`:''}
    ${r.symptoms?`<div class="small muted">${esc(r.symptoms)}</div>`:''}
    ${meds.length?`<ul class="meds">${meds.map(m=>`<li>💊 ${esc(m.name)}${m.ingredient?` <span class="ing">(${esc(m.ingredient)})</span>`:''}${medDose(m)?` <span class="ing">· ${esc(medDose(m))}</span>`:''}</li>`).join('')}</ul>`:''}
    ${(r.copay!=null||r.totalCost!=null)?`<div class="small" style="margin-top:6px">본인부담 <b>${won(r.copay)||'-'}</b>${r.totalCost!=null?` <span class="muted">/ 총 진료비 ${won(r.totalCost)}</span>`:''}</div>`:''}
  </div>`;
}
function medDose(m){
  return [m.dosage, m.frequency, m.days?`${m.days}일분`:''].filter(Boolean).join(' · ');
}
function viewRecords(v){
  const list = filtered();
  v.innerHTML = memberChips() +
    `<input type="search" id="q" placeholder="병원·진단명·약 이름·성분 검색" value="${esc(ui.q)}">` +
    (backupReminder()) +
    (list.length ? list.map(recCard).join('') :
      `<div class="empty">기록이 없어요.<br>오른쪽 아래 ＋ 버튼이나 <b>캡쳐등록</b> 탭으로 추가하세요.</div>`);
  bindChips();
  const q = document.getElementById('q');
  q.oninput = ()=>{ ui.q = q.value; const pos=q.selectionStart; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); };
  v.querySelectorAll('.rec').forEach(el=> el.onclick = ()=> openEditor(db.records.find(r=>r.id===el.dataset.id)));
}
function backupReminder(){
  if(!db.records.length) return '';
  const last = db.lastBackup ? new Date(db.lastBackup) : null;
  const days = last ? Math.floor((Date.now()-last)/864e5) : null;
  if(last && days < 14) return '';
  return `<div class="notice">💾 ${last?`마지막 백업이 ${days}일 전이에요.`:'아직 백업한 적이 없어요.'} 폰 브라우저 데이터가 지워지면 기록도 사라지니 <b>가족·백업</b> 탭에서 백업해 두세요.</div>`;
}

/* ================= 기록 편집 ================= */
function openEditor(rec){
  const isNew = !rec;
  const r = rec ? JSON.parse(JSON.stringify(rec)) : {
    id:uid(), memberId: ui.member!=='all' ? ui.member : (db.members[0]?.id||''), date:today(),
    hospital:'', department:'', diagnosis:'', symptoms:'', totalCost:null, copay:null,
    medications:[], insurance:{status:'unclaimed',claimDate:'',paidAmount:null}, memo:''
  };
  r.insurance = r.insurance || {status:'unclaimed'};
  const sheet = document.getElementById('sheet');
  const medRow = (m={},i)=>`<div class="medbox" data-i="${i}">
      <div class="row between"><b class="small">약 ${i+1}</b><button class="btn ghost small" data-delmed="${i}" style="padding:4px 10px">삭제</button></div>
      <div class="grid2">
        <div><label>약 이름</label><input data-f="name" value="${esc(m.name)}"></div>
        <div><label>성분명</label><input data-f="ingredient" value="${esc(m.ingredient)}"></div>
        <div><label>1회 용량</label><input data-f="dosage" value="${esc(m.dosage)}" placeholder="예: 1정"></div>
        <div><label>복용 횟수</label><input data-f="frequency" value="${esc(m.frequency)}" placeholder="예: 1일 3회 식후"></div>
        <div><label>복용 일수</label><input data-f="days" inputmode="numeric" value="${esc(m.days)}" placeholder="예: 3"></div>
      </div></div>`;
  function draw(){
    sheet.innerHTML = `
    <div class="row between"><h2 style="margin:0">${isNew?'새 진료기록':'진료기록 수정'}</h2><button class="btn ghost" id="eClose">닫기</button></div>
    <label>가족</label>
    <select id="eMember">${db.members.map(m=>`<option value="${m.id}" ${m.id===r.memberId?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
    <div class="grid2">
      <div><label>진료일</label><input type="date" id="eDate" value="${esc(r.date)}"></div>
      <div><label>진료과</label><input id="eDept" value="${esc(r.department)}" placeholder="예: 소아청소년과"></div>
    </div>
    <label>병원·약국 이름</label><input id="eHosp" value="${esc(r.hospital)}">
    <label>진단명</label><input id="eDiag" value="${esc(r.diagnosis)}" placeholder="예: 급성 기관지염">
    <label>증상 메모</label><textarea id="eSym" style="min-height:60px">${esc(r.symptoms)}</textarea>
    <div class="grid2">
      <div><label>총 진료비(원)</label><input id="eTotal" inputmode="numeric" value="${r.totalCost??''}"></div>
      <div><label>본인부담금(원)</label><input id="eCopay" inputmode="numeric" value="${r.copay??''}"></div>
    </div>
    <h2>처방약</h2>
    <div id="meds">${r.medications.map(medRow).join('')}</div>
    <button class="btn sub full" id="addMed">＋ 약 추가</button>
    <h2>보험 청구</h2>
    <div class="seg" id="eIns">${Object.entries(INS).map(([k,o])=>`<button data-s="${k}" class="${r.insurance.status===k?'on':''}">${o.label}</button>`).join('')}</div>
    <div class="grid2">
      <div><label>청구일</label><input type="date" id="eClaim" value="${esc(r.insurance.claimDate)}"></div>
      <div><label>지급액(원)</label><input id="ePaid" inputmode="numeric" value="${r.insurance.paidAmount??''}"></div>
    </div>
    <label>메모</label><textarea id="eMemo" style="min-height:60px">${esc(r.memo)}</textarea>
    <div class="row" style="margin-top:16px">
      ${isNew?'':'<button class="btn danger" id="eDel">삭제</button>'}
      <button class="btn" style="flex:1" id="eSave">저장</button>
    </div>`;
    bind();
  }
  function collect(){
    r.memberId = sheet.querySelector('#eMember').value;
    r.date = sheet.querySelector('#eDate').value;
    r.department = sheet.querySelector('#eDept').value.trim();
    r.hospital = sheet.querySelector('#eHosp').value.trim();
    r.diagnosis = sheet.querySelector('#eDiag').value.trim();
    r.symptoms = sheet.querySelector('#eSym').value.trim();
    r.totalCost = toNum(sheet.querySelector('#eTotal').value);
    r.copay = toNum(sheet.querySelector('#eCopay').value);
    r.insurance.claimDate = sheet.querySelector('#eClaim').value;
    r.insurance.paidAmount = toNum(sheet.querySelector('#ePaid').value);
    r.memo = sheet.querySelector('#eMemo').value.trim();
    r.medications = [...sheet.querySelectorAll('.medbox')].map(box=>{
      const g = f => box.querySelector(`[data-f="${f}"]`).value.trim();
      return {name:g('name'), ingredient:g('ingredient'), dosage:g('dosage'), frequency:g('frequency'), days:toNum(g('days'))};
    });
  }
  function bind(){
    sheet.querySelector('#eClose').onclick = closeModal;
    sheet.querySelector('#addMed').onclick = ()=>{ collect(); r.medications.push({}); draw(); };
    sheet.querySelectorAll('[data-delmed]').forEach(b=> b.onclick = ()=>{ collect(); r.medications.splice(+b.dataset.delmed,1); draw(); });
    sheet.querySelector('#eIns').onclick = e=>{
      const b = e.target.closest('[data-s]'); if(!b) return;
      collect(); r.insurance.status = b.dataset.s;
      if(b.dataset.s==='claimed' && !r.insurance.claimDate) r.insurance.claimDate = today();
      draw();
    };
    const del = sheet.querySelector('#eDel');
    if(del) del.onclick = ()=>{
      if(!confirm('이 기록을 삭제할까요?')) return;
      db.records = db.records.filter(x=>x.id!==r.id);
      db.deleted.push({id:r.id, at:now()}); save(); closeModal(); render(); toast('삭제했어요');
    };
    sheet.querySelector('#eSave').onclick = ()=>{

const AI_PROMPT = `첨부한 이미지(처방전, 약봉투, 약제비 영수증, 진료비 영수증, 진료비 세부내역서 등)를 읽고, 아래 JSON 형식으로만 답해줘. 설명이나 다른 말은 쓰지 말고 JSON만 출력해.

규칙:
- 날짜는 YYYY-MM-DD 형식
- 금액은 쉼표와 '원' 없이 숫자만 (예: 12300)
- 이미지에 없는 값은 "" 또는 null
- 약국 영수증·약봉투면 hospital에는 처방한 병원명을, 병원명이 없으면 약국명을 적어줘

- 서로 다른 날짜나 병원의 기록이 여러 개면 records 배열에 나눠서 넣어줘

{

}`;
let pending = null;

function copyText(t){
  const done = ()=>toast('복사했어요. AI 채팅에 붙여넣으세요');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done, ()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ alert('복사에 실패했어요. 미리보기에서 직접 복사해 주세요.'); }
    ta.remove();
  }
}
function parseAI(text){
  if(!text || !text.trim()) return null;
  let s = text.trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence) s = fence[1];
  const start = s.search(/[\[{]/);
  if(start<0) return null;
  const open = s[start], close = open==='{'?'}':']';
  const end = s.lastIndexOf(close);
  if(end<=start) return null;
  let obj;
  try{ obj = JSON.parse(s.slice(start,end+1)); }
  catch(e){
    try{ obj = JSON.parse(s.slice(start,end+1).replace(/,\s*([}\]])/g,'$1').replace(/[“”]/g,'"')); }
    catch(e2){ return null; }
  }
  let arr = Array.isArray(obj) ? obj : (obj.records || obj.visits || [obj]);
  if(!Array.isArray(arr)) return null;
  return arr.filter(x=>x && typeof x==='object').map(x=>({
    date: normDate(x.date) || today(),
    hospital: String(x.hospital||x.clinic||x.pharmacy||'').trim(),
    department: String(x.department||'').trim(),
    diagnosis: String(x.diagnosis||'').trim(),
    symptoms: String(x.symptoms||'').trim(),
    totalCost: toNum(x.totalCost),
    copay: toNum(x.copay),
    memo: String(x.memo||'').trim(),
    medications: (Array.isArray(x.medications)?x.medications:[]).map(m=>({
      name:String(m.name||'').trim(), ingredient:String(m.ingredient||'').trim(),
      dosage:String(m.dosage||'').trim(), frequency:String(m.frequency||'').trim(), days:toNum(m.days)
    })).filter(m=>m.name||m.ingredient)
  }));
}
function findSame(r){
  return db.records.find(x=> x.memberId===r.memberId && x.date===r.date &&
    x.hospital && r.hospital && x.hospital.replace(/\s/g,'')===r.hospital.replace(/\s/g,''));
}

        ${(r.copay!=null||r.totalCost!=null)?`<div class="small" style="margin-top:6px">본인부담 <b>${won(r.copay)||'-'}</b>${r.totalCost!=null?` / 총 ${won(r.totalCost)}`:''}</div>`:''}

        });

        r.medications.forEach(m=>{

          const ex = same.medications.find(o=>(o.name||o.ingredient).replace(/\s/g,'')===k);

        added++;

    toast([added?`새 기록 ${added}건`:'', merged?`기존 기록 ${merged}건에 합침`:''].filter(Boolean).join(', ') + ' · 저장했어요');

    <div class="row wrap" id="mCol">${COLORS.map(c=>`<button data-c="${c}" style="width:34px;height:34px;border-radius:50%;border:3px solid ${c===x.color?'#1f2a27':'transparent'};background:${c}"></button>`).join('')}</div>
    <div class="row" style="margin-top:16px">
      ${isNew?'':'<button class="btn danger" id="mDel">삭제</button>'}
      <button class="btn" style="flex:1" id="mSave">저장</button>
    </div>`;
  sheet.querySelector('#mClose').onclick = closeModal;
  sheet.querySelector('#mCol').onclick = e=>{ const b=e.target.closest('[data-c]'); if(!b) return;
    x.color=b.dataset.c; sheet.querySelectorAll('#mCol button').forEach(o=>o.style.borderColor = o.dataset.c===x.color?'#1f2a27':'transparent'); };
  const del = sheet.querySelector('#mDel');
  if(del) del.onclick = ()=>{
    const n = db.records.filter(r=>r.memberId===x.id).length;
    if(n){ alert(`이 가족의 기록이 ${n}건 있어서 삭제할 수 없어요. 기록을 먼저 지워 주세요.`); return; }
    if(!confirm('삭제할까요?')) return;
    db.members = db.members.filter(o=>o.id!==x.id); db.deleted.push({id:x.id,at:now()});
    if(ui.member===x.id) ui.member='all';
    save(); closeModal(); render();
  };
  sheet.querySelector('#mSave').onclick = ()=>{
    x.name = sheet.querySelector('#mName').value.trim();
    x.relation = sheet.querySelector('#mRel').value.trim();
    x.note = sheet.querySelector('#mNote').value.trim();
    if(!x.name){ alert('이름을 입력해 주세요.'); return; }
    x.updatedAt = now();
    const i = db.members.findIndex(o=>o.id===x.id);
    if(i>=0) db.members[i]=x; else db.members.push(x);
    save(); closeModal(); render(); toast('저장했어요');
  };
  openModal();
}

/* ---------- 백업 ---------- */
function backupBlob(){
  const data = {...db, exportedAt: now()};
  return new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
}
function backupName(){
  const d = new Date(); const p = n=>String(n).padStart(2,'0');
  return `진료수첩_백업_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
}
function markBackup(){ db.lastBackup = now(); save(); render(); }
function exportBackup(){
  const url = URL.createObjectURL(backupBlob());
  const a = document.createElement('a'); a.href=url; a.download=backupName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  markBackup(); toast('백업 파일을 내려받았어요');
}
async function shareBackup(){
  const file = new File([backupBlob()], backupName(), {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'진료수첩 백업'}); markBackup(); }
    catch(e){ if(e.name!=='AbortError') exportBackup(); }
  } else exportBackup();
}
function pickBackup(){ const f=document.getElementById('fileIn'); f.value=''; f.click(); }
document.getElementById('fileIn').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let inc;
    try{ inc = JSON.parse(rd.result); }catch(err){ alert('백업 파일을 읽을 수 없어요.'); return; }
    if(!inc || inc.app!=='medinfo' || !Array.isArray(inc.records)){ alert('진료수첩 백업 파일이 아니에요.'); return; }
    const res = mergeBackup(inc);
    save(); ui.member='all'; render();
    alert(`가져오기 완료\n· 가족 ${res.mAdd}명 추가\n· 기록 ${res.rAdd}건 추가, ${res.rUpd}건 갱신${res.rDel?`, ${res.rDel}건 삭제 반영`:''}`);
  };
  rd.readAsText(file);
});
function mergeBackup(inc){
  const res = {mAdd:0,rAdd:0,rUpd:0,rDel:0};
  const delMap = new Map(db.deleted.map(d=>[d.id,d.at]));
  (inc.deleted||[]).forEach(d=>{ if(!delMap.has(d.id) || delMap.get(d.id)<d.at) delMap.set(d.id,d.at); });
  // 가족: id가 다르더라도 이름이 같으면 같은 사람으로 봄
  const idMap = {};
  (inc.members||[]).forEach(m=>{
    if(delMap.has(m.id)) return;
    let mine = db.members.find(o=>o.id===m.id) || db.members.find(o=>o.name.replace(/\s/g,'')===String(m.name).replace(/\s/g,''));
    if(mine){
      idMap[m.id]=mine.id;
      if(mine.id===m.id && (m.updatedAt||'')>(mine.updatedAt||'')) Object.assign(mine, m);
    } else { db.members.push({...m}); idMap[m.id]=m.id; res.mAdd++; }
  });
  (inc.records||[]).forEach(r=>{
    if(delMap.has(r.id)) return;
    const rr = {...r, memberId: idMap[r.memberId] || r.memberId};
    const i = db.records.findIndex(o=>o.id===rr.id);
    if(i<0){ db.records.push(rr); res.rAdd++; }
    else if((rr.updatedAt||'')>(db.records[i].updatedAt||'')){ db.records[i]=rr; res.rUpd++; }
  });
  const before = db.records.length;
  db.records = db.records.filter(r=>{
    const d = delMap.get(r.id); return !(d && d >= (r.updatedAt||''));
  });
  db.members = db.members.filter(m=>!delMap.has(m.id) || db.records.some(r=>r.memberId===m.id));
  res.rDel = before - db.records.length;
  db.deleted = [...delMap].map(([id,at])=>({id,at}));
  return res;
}

render();
</script>
